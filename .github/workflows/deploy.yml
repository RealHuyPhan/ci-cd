name: Deploy React to AWS S3 & CloudFront

on:
  push:
    branches:
      - main # Chạy khi có code push lên nhánh main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cài đặt thư viện và Build
      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Cấu hình AWS CLI bằng 2 cái key đã lưu trong Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2 # Thay bằng region lúc bạn tạo S3, thường là ap-southeast-1 (Singapore)

      # Copy thư mục dist (build) lên S3
      - name: Deploy to S3
        run: aws s3 sync ./dist s3://my-react-cicd-bucket-realhuyp --delete

      # Xóa cache CloudFront (Thay DISTRIBUTION_ID bằng ID thật của bạn ở tab General của CloudFront)
      #- name: Invalidate CloudFront Cache
      #  run: aws cloudfront create-invalidation --distribution-id <DISTRIBUTION_ID_CỦA_BẠN> --paths "/*"
